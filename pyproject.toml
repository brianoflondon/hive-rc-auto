[project]
name = "hive-rc-auto"
version = "1.8.0"
description = "A system for managing RC Resource Credits on Hive"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "Brian of London", email = "brian@podping.org" }]
dependencies = [
    "backoff>=2.2.1",
    "httpx>=0.28",
    "lighthive>=0.4.4",
    "numpy>=2.2",
    "pandas>=2.2",
    "plotly>=5.24",
    "pydantic>=2.10",
    "pymongo>=4.15",
    "pymssql>=2.3.8",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "streamlit>=1.40",
    "tabulate>=0.10.0",
    "watchdog>=6",
    "xmltodict>=0.14",
]

[dependency-groups]
dev = [
    "black>=24.10",
    "flake8>=7.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]
notebooks = [
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "nbformat>=5.10",
    "notebook>=7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hive_rc_auto"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
