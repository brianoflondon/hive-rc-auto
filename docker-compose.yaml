services:

  rc_bot:
    container_name: rc_bot
    build:
      context: .
      dockerfile: Dockerfile
    logging:
      driver: "json-file"
      options:
          max-file: "5"
          max-size: "10m"
    env_file:
      - ".env"
    # environment:
    #   DB_CONNECTION: "mongodb://mongodb:27017"
    command: bash -c "python bot.py"
    restart: unless-stopped
    networks:
      - repl-mongo_default
    extra_hosts:
      - "gad-v4vapp.tail400e5.ts.net:100.85.133.47"
      - "dave-v4vapp.tail400e5.ts.net:100.102.211.2"
      - "edi-v4vapp.tail400e5.ts.net:100.107.241.103"
      - "adam-v4vapp.tail400e5.ts.net:100.125.51.61"
    # networks:
    #   - hive-network


  rc_dash:
    container_name: rc_dash
    build:
      context: .
      dockerfile: Dockerfile
    logging:
      driver: "json-file"
      options:
          max-file: "5"
          max-size: "10m"
    env_file:
      - ".env"
    ports:
      - "${LOCAL_TAILSCALE_IP}:8501:8501"
      - "127.0.0.1:8501:8501"
      - "127.0.1.1:8501:8501"
    # environment:
    #   DB_CONNECTION: "mongodb://mongodb:27017"
    command: bash -c "streamlit run Podping.py"
    restart: unless-stopped
    network_mode: host
    extra_hosts:
      - "gad-v4vapp.tail400e5.ts.net:100.85.133.47"
      - "dave-v4vapp.tail400e5.ts.net:100.102.211.2"
      - "edi-v4vapp.tail400e5.ts.net:100.107.241.103"
      - "adam-v4vapp.tail400e5.ts.net:100.125.51.61"

networks:
  repl-mongo_default:
    external: true
