services:

  rc_bot:
    container_name: rc_bot
    image: brianoflondon/hive-rc-auto:${IMAGE_TAG:-main}
    logging:
      driver: "json-file"
      options:
          max-file: "5"
          max-size: "10m"
    env_file:
      - ".env"
    # environment:
    #   DB_CONNECTION: "mongodb://mongodb:27017"
    command: bash -c "python bot.py"
    restart: unless-stopped
    networks:
      - repl-mongo_default
    extra_hosts:
      - "gad-v4vapp.tail400e5.ts.net:100.85.133.47"
      - "dave-v4vapp.tail400e5.ts.net:100.102.211.2"
      - "edi-v4vapp.tail400e5.ts.net:100.107.241.103"
      - "adam-v4vapp.tail400e5.ts.net:100.125.51.61"
    # networks:
    #   - hive-network


  rc_dash:
    container_name: rc_dash
    image: brianoflondon/hive-rc-auto:${IMAGE_TAG:-main}
    logging:
      driver: "json-file"
      options:
          max-file: "5"
          max-size: "10m"
    env_file:
      - ".env"
    # environment:
    #   DB_CONNECTION: "mongodb://mongodb:27017"
    # Reachable only on the traefik-public network, as http://rc_dash:8501.
    command: bash -c "streamlit run Podping.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true --server.enableCORS=false --server.enableXsrfProtection=false"
    restart: unless-stopped
    networks:
      - traefik-public
      - repl-mongo_default
    extra_hosts:
      - "gad-v4vapp.tail400e5.ts.net:100.85.133.47"
      - "dave-v4vapp.tail400e5.ts.net:100.102.211.2"
      - "edi-v4vapp.tail400e5.ts.net:100.107.241.103"
      - "adam-v4vapp.tail400e5.ts.net:100.125.51.61"

networks:
  traefik-public:
    external: true
  repl-mongo_default:
    external: true
    # networks:
    #   - hive-network

